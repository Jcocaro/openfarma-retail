<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Agenda Retail — Openfarma</title>
<style>
:root {
  --green: #00C22B; --green-dark: #009E22; --green-light: #E8F9EC;
  --bg: #EFEFEF; --surface: #FFFFFF; --surface2: #F5F5F5;
  --border: #DEDEDE; --text: #333333; --text-muted: #777777; --text-light: #AAAAAA;
  --sidebar-bg: #1A1A1A; --radius: 10px; --radius-sm: 6px;
  --font: Calibri, Arial, sans-serif;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: var(--font); background: var(--bg); color: var(--text); min-height: 100vh; font-size: 14px; line-height: 1.5; }

/* LOGIN */
.login-overlay { position: fixed; inset: 0; z-index: 999; background: var(--green); display: flex; align-items: center; justify-content: center; }
.login-overlay.hidden { display: none; }
.login-box { background: #fff; border-radius: 16px; padding: 40px 44px; width: 380px; max-width: 95vw; text-align: center; box-shadow: 0 24px 60px rgba(0,0,0,0.18); }
.login-logo { width: 180px; margin: 0 auto 28px; display: block; }
.login-title { font-size: 17px; font-weight: 700; color: #333; margin-bottom: 6px; }
.login-sub { font-size: 13px; color: #888; margin-bottom: 28px; line-height: 1.5; }
.login-field { width: 100%; padding: 11px 14px; border: 1.5px solid #DEDEDE; border-radius: 8px; font-family: var(--font); font-size: 15px; color: #333; outline: none; text-align: center; margin-bottom: 12px; transition: border-color 0.15s; }
.login-field:focus { border-color: var(--green); }
.login-field.pin-field { letter-spacing: 0.25em; font-size: 20px; font-weight: 700; }
.login-btn { width: 100%; padding: 12px; background: var(--green); color: #fff; border: none; border-radius: 8px; font-family: var(--font); font-size: 15px; font-weight: 700; cursor: pointer; transition: background 0.15s; margin-top: 4px; }
.login-btn:hover { background: var(--green-dark); }
.login-error { font-size: 12px; color: #CC2222; margin-top: 8px; min-height: 18px; }
.login-loading { font-size: 13px; color: var(--text-muted); margin-top: 10px; }

/* APP */
.app { display: flex; min-height: 100vh; }
.sidebar { width: 250px; min-width: 250px; background: var(--sidebar-bg); display: flex; flex-direction: column; position: fixed; top: 0; left: 0; bottom: 0; z-index: 100; overflow-y: auto; overflow-x: hidden; }
.sidebar-header { background: var(--green); padding: 20px 20px 18px; }
.logo-img { width: 160px; display: block; filter: brightness(0) invert(1); }
.logo-sub { font-size: 11px; color: rgba(255,255,255,0.75); letter-spacing: 0.06em; text-transform: uppercase; margin-top: 6px; }
.sidebar-section { padding: 18px 14px 6px; }
.sidebar-label { font-size: 10px; letter-spacing: 0.1em; text-transform: uppercase; color: rgba(255,255,255,0.3); padding: 0 8px; margin-bottom: 6px; }
.nav-item { display: flex; align-items: center; gap: 10px; padding: 9px 12px; border-radius: var(--radius-sm); cursor: pointer; font-size: 13.5px; color: rgba(255,255,255,0.6); transition: background 0.15s, color 0.15s; margin-bottom: 2px; font-family: var(--font); }
.nav-item:hover { background: rgba(255,255,255,0.08); color: #fff; }
.nav-item.active { background: var(--green); color: #fff; }
.nav-item .nav-count { margin-left: auto; background: rgba(255,255,255,0.1); color: rgba(255,255,255,0.6); font-size: 11px; padding: 1px 7px; border-radius: 20px; }
.nav-item.active .nav-count { background: rgba(255,255,255,0.25); color: #fff; }
.sidebar-projects { flex: 1; padding: 4px 14px 14px; overflow-y: auto; }
.proj-nav-item { display: flex; align-items: center; gap: 9px; padding: 8px 12px; border-radius: var(--radius-sm); cursor: pointer; font-size: 13px; color: rgba(255,255,255,0.55); transition: all 0.15s; margin-bottom: 1px; font-family: var(--font); }
.proj-nav-item:hover { background: rgba(255,255,255,0.07); color: #fff; }
.proj-nav-item.active { background: rgba(0,194,43,0.2); color: #fff; border-left: 3px solid var(--green); padding-left: 9px; }
.proj-dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }
.proj-nav-name { flex: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.btn-new-proj { display: flex; align-items: center; gap: 8px; padding: 9px 12px; background: rgba(0,194,43,0.12); border: 1px dashed rgba(0,194,43,0.35); border-radius: var(--radius-sm); color: rgba(0,194,43,0.8); cursor: pointer; font-size: 13px; width: 100%; transition: all 0.15s; font-family: var(--font); margin-top: 8px; }
.btn-new-proj:hover { background: rgba(0,194,43,0.2); color: var(--green); }
.main { margin-left: 250px; flex: 1; display: flex; flex-direction: column; min-height: 100vh; }
.topbar { background: var(--surface); border-bottom: 3px solid var(--green); padding: 0 28px; height: 58px; display: flex; align-items: center; gap: 14px; position: sticky; top: 0; z-index: 50; }
.topbar-title { font-family: var(--font); font-size: 17px; font-weight: 700; color: var(--text); flex: 1; }
.btn { display: inline-flex; align-items: center; gap: 6px; padding: 8px 18px; border-radius: 20px; font-size: 13px; font-family: var(--font); font-weight: 700; cursor: pointer; transition: all 0.15s; border: none; }
.btn-primary { background: var(--green); color: #fff; }
.btn-primary:hover { background: var(--green-dark); }
.btn-secondary { background: var(--surface2); color: var(--text); border: 1px solid var(--border); border-radius: var(--radius-sm); }
.btn-secondary:hover { background: var(--border); }
.btn-ghost { background: transparent; color: var(--text-muted); border: 1px solid var(--border); border-radius: var(--radius-sm); }
.btn-ghost:hover { background: var(--surface2); color: var(--text); }
.btn-danger { background: transparent; color: #CC2222; border: 1px solid #EDCDC7; border-radius: var(--radius-sm); }
.btn-danger:hover { background: #FFF0F0; }
.user-chip { display: flex; align-items: center; gap: 8px; padding: 5px 12px 5px 6px; background: var(--green-light); border-radius: 20px; }
.user-avatar { width: 26px; height: 26px; border-radius: 50%; background: var(--green); color: #fff; display: flex; align-items: center; justify-content: center; font-size: 11px; font-weight: 700; }
.user-name { font-size: 13px; color: var(--green-dark); font-weight: 700; }
.logout-btn { background: none; border: none; color: var(--text-light); font-size: 12px; cursor: pointer; padding: 4px 8px; font-family: var(--font); transition: color 0.15s; }
.logout-btn:hover { color: #CC2222; }
.content { padding: 24px 28px; flex: 1; }
.view { display: none; }
.view.active { display: block; }
.stats-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; margin-bottom: 24px; }
.stat-card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 16px 18px; border-top: 3px solid var(--green); }
.stat-label { font-size: 11px; text-transform: uppercase; letter-spacing: 0.07em; color: var(--text-light); margin-bottom: 5px; font-weight: 700; }
.stat-value { font-size: 30px; font-weight: 700; color: var(--green); line-height: 1; }
.stat-sub { font-size: 12px; color: var(--text-muted); margin-top: 3px; }
.section-title { font-size: 15px; font-weight: 700; color: var(--text); margin-bottom: 12px; }
.projects-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(290px, 1fr)); gap: 14px; margin-bottom: 24px; }
.project-card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 18px; cursor: pointer; transition: border-color 0.15s, box-shadow 0.15s; border-left: 4px solid var(--green); }
.project-card:hover { box-shadow: 0 2px 12px rgba(0,194,43,0.12); }
.project-card-header { display: flex; align-items: flex-start; gap: 10px; margin-bottom: 10px; }
.project-color-dot { width: 10px; height: 10px; border-radius: 50%; margin-top: 5px; flex-shrink: 0; }
.project-card-name { font-size: 14px; font-weight: 700; color: var(--text); flex: 1; line-height: 1.3; }
.project-desc { font-size: 13px; color: var(--text-muted); margin-bottom: 12px; line-height: 1.45; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.project-meta { display: flex; align-items: center; gap: 7px; flex-wrap: wrap; }
.badge { display: inline-flex; align-items: center; padding: 3px 9px; border-radius: 20px; font-size: 11px; font-weight: 700; }
.badge-alta { background: #FFE8E8; color: #CC2222; }
.badge-media { background: #FFF3CD; color: #856404; }
.badge-baja { background: var(--green-light); color: #006618; }
.badge-activo { background: var(--green-light); color: #006618; }
.badge-pausado { background: #FFF3CD; color: #856404; }
.badge-terminado { background: var(--surface2); color: var(--text-muted); }
.badge-planificacion { background: #E3EAF6; color: #1A3460; }
.progress-bar { height: 4px; background: var(--surface2); border-radius: 2px; margin-top: 12px; overflow: hidden; }
.progress-fill { height: 100%; background: var(--green); border-radius: 2px; transition: width 0.3s; }
.task-count { font-size: 12px; color: var(--text-muted); margin-top: 6px; }
.project-detail-header { display: flex; align-items: flex-start; gap: 20px; margin-bottom: 20px; padding-bottom: 18px; border-bottom: 1px solid var(--border); }
.project-detail-title { font-size: 22px; font-weight: 700; color: var(--text); line-height: 1.2; margin-bottom: 8px; }
.project-detail-meta { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.tabs { display: flex; gap: 0; border-bottom: 2px solid var(--border); margin-bottom: 20px; }
.tab { padding: 9px 20px; font-size: 13.5px; color: var(--text-muted); cursor: pointer; transition: all 0.15s; font-weight: 700; font-family: var(--font); border-bottom: 2px solid transparent; margin-bottom: -2px; }
.tab.active { color: var(--green); border-bottom-color: var(--green); }
.tab:hover:not(.active) { color: var(--text); }
.task-list { display: flex; flex-direction: column; gap: 7px; }
.task-item { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-sm); padding: 0; display: flex; flex-wrap: wrap; align-items: stretch; transition: border-color 0.15s; overflow: hidden; }
.task-item-row { display: flex; align-items: center; gap: 11px; padding: 11px 14px; width: 100%; }
.task-item:hover { border-color: var(--green); }
.task-check { width: 18px; height: 18px; border: 2px solid var(--border); border-radius: 4px; flex-shrink: 0; cursor: pointer; display: flex; align-items: center; justify-content: center; transition: all 0.15s; background: var(--surface); font-size: 11px; font-weight: 700; color: transparent; }
.task-check.done { background: var(--green); border-color: var(--green); color: #fff; }
.task-title { flex: 1; font-size: 13.5px; color: var(--text); }
.task-item.completed .task-title { text-decoration: line-through; color: var(--text-light); }
.task-meta-row { display: flex; align-items: center; gap: 7px; flex-shrink: 0; }
.task-person { font-size: 12px; color: var(--text-muted); background: var(--surface2); padding: 2px 8px; border-radius: 4px; }
.task-date { font-size: 12px; color: var(--text-muted); }
.task-date.overdue { color: #CC2222; font-weight: 700; }
.task-prio { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }
.add-item-row { display: flex; gap: 8px; margin-top: 12px; flex-wrap: wrap; }
.input-field { flex: 1; padding: 9px 12px; border: 1px solid var(--border); border-radius: var(--radius-sm); font-family: var(--font); font-size: 13.5px; color: var(--text); background: var(--surface); outline: none; transition: border-color 0.15s; }
.input-field:focus { border-color: var(--green); }
.input-field::placeholder { color: var(--text-light); }
select.input-field { cursor: pointer; }
.notes-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 12px; }
.note-card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 14px; border-top: 3px solid var(--green); }
.note-card-header { display: flex; align-items: flex-start; justify-content: space-between; margin-bottom: 6px; }
.note-date { font-size: 11px; color: var(--text-light); }
.note-author { font-size: 12px; font-weight: 700; color: var(--green); margin-bottom: 5px; }
.note-text { font-size: 13px; color: var(--text); line-height: 1.5; white-space: pre-wrap; }
.files-list { display: flex; flex-direction: column; gap: 8px; }
.file-item { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-sm); padding: 11px 14px; display: flex; align-items: center; gap: 12px; }
.file-icon { width: 36px; height: 36px; border-radius: var(--radius-sm); background: var(--green-light); display: flex; align-items: center; justify-content: center; font-size: 18px; flex-shrink: 0; }
.file-info { flex: 1; }
.file-name { font-size: 13px; font-weight: 700; color: var(--text); }
.file-meta { font-size: 12px; color: var(--text-muted); margin-top: 1px; }
.upload-zone { border: 2px dashed var(--border); border-radius: var(--radius); padding: 24px; text-align: center; cursor: pointer; transition: border-color 0.15s, background 0.15s; margin-bottom: 14px; }
.upload-zone:hover { border-color: var(--green); background: var(--green-light); }
.upload-zone input { display: none; }
.upload-zone p { font-size: 13px; color: var(--text-muted); margin-top: 5px; }
.upload-zone-icon { font-size: 28px; color: var(--green); }
.modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.5); z-index: 200; display: none; align-items: center; justify-content: center; }
.modal-overlay.open { display: flex; }
.modal { background: var(--surface); border-radius: var(--radius); border: 1px solid var(--border); padding: 26px; width: 480px; max-width: 95vw; max-height: 85vh; overflow-y: auto; box-shadow: 0 16px 50px rgba(0,0,0,0.15); }
.modal-title { font-size: 17px; font-weight: 700; margin-bottom: 18px; color: var(--text); }
.form-group { margin-bottom: 14px; }
.form-label { display: block; font-size: 12px; font-weight: 700; color: var(--text-muted); margin-bottom: 5px; text-transform: uppercase; letter-spacing: 0.05em; }
textarea.input-field { width: 100%; min-height: 75px; resize: vertical; }
.form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.modal-actions { display: flex; gap: 8px; justify-content: flex-end; margin-top: 18px; }
.empty-state { text-align: center; padding: 36px 20px; color: var(--text-muted); }
.empty-state p { font-size: 13px; }
.activity-list { display: flex; flex-direction: column; gap: 1px; }
.activity-item { display: flex; align-items: flex-start; gap: 10px; padding: 9px 10px; border-radius: var(--radius-sm); transition: background 0.12s; }
.activity-item:hover { background: var(--surface2); }
.activity-dot { width: 8px; height: 8px; border-radius: 50%; margin-top: 5px; flex-shrink: 0; }
.activity-text { font-size: 13px; color: var(--text); flex: 1; line-height: 1.4; }
.activity-time { font-size: 11px; color: var(--text-light); white-space: nowrap; }
.color-swatches { display: flex; gap: 8px; flex-wrap: wrap; }
.color-swatch { width: 24px; height: 24px; border-radius: 50%; cursor: pointer; border: 2px solid transparent; transition: border-color 0.15s, transform 0.15s; }
.color-swatch.selected, .color-swatch:hover { border-color: #333; transform: scale(1.15); }
.section-row { display: flex; align-items: center; justify-content: space-between; margin-bottom: 12px; }
.back-btn { display: inline-flex; align-items: center; gap: 6px; font-size: 13px; color: var(--green); cursor: pointer; background: none; border: none; font-family: var(--font); padding: 0; margin-bottom: 14px; font-weight: 700; }
.back-btn:hover { color: var(--green-dark); }
.two-col { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
.sync-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--green); display: inline-block; margin-right: 6px; animation: pulse 2s infinite; }
@keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.4} }
.saving { font-size: 11px; color: var(--text-light); }
.task-date-input { font-size: 12px; color: var(--text-muted); border: 1px solid transparent; background: transparent; cursor: pointer; font-family: var(--font); padding: 2px 6px; border-radius: 4px; transition: border-color 0.15s, background 0.15s; }
.task-date-input:hover { background: var(--surface2); border-color: var(--border); }
.task-date-input:focus { border-color: var(--green); background: var(--surface); outline: none; }
.task-date-input.overdue { color: #CC2222; font-weight: 700; }
.task-date-input.empty { color: var(--text-light); }
.task-notes-btn { background: none; border: 1px solid transparent; cursor: pointer; color: var(--text-light); font-size: 12px; padding: 2px 7px; border-radius: 4px; font-family: var(--font); transition: all 0.15s; }
.task-notes-btn:hover { color: var(--green); border-color: var(--green); background: var(--green-light); }
.task-notes-btn.has-notes { color: var(--green); font-weight: 700; }
.task-notes-panel { background: var(--surface2); border-top: 1px solid var(--border); padding: 10px 14px 10px 44px; display: none; width: 100%; }
.task-note-item { font-size: 12px; padding: 5px 0; border-bottom: 1px solid var(--border); display: flex; gap: 8px; align-items: baseline; }
.task-note-item:last-of-type { border-bottom: none; }
.task-note-author { font-weight: 700; color: var(--green); white-space: nowrap; flex-shrink: 0; }
.task-note-text { flex: 1; color: var(--text); line-height: 1.4; }
.task-note-date { font-size: 11px; color: var(--text-light); white-space: nowrap; flex-shrink: 0; }
.task-notes-add { display: flex; gap: 6px; margin-top: 8px; }
/* AREAS */
.areas-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 14px; margin-bottom: 28px; }
.area-card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 18px; border-top: 4px solid var(--green); transition: box-shadow 0.15s; }
.area-card:hover { box-shadow: 0 2px 12px rgba(0,0,0,0.08); }
.area-card-name { font-size: 12px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.07em; margin-bottom: 10px; }
.area-card-stat { font-size: 30px; font-weight: 700; line-height: 1; margin-bottom: 2px; }
.area-card-sub { font-size: 12px; color: var(--text-muted); }
/* TASK DETAIL PANEL */
.task-detail-overlay { position: fixed; inset: 0; z-index: 150; pointer-events: none; }
.task-detail-overlay.open { pointer-events: all; }
.task-detail-backdrop { position: absolute; inset: 0; background: rgba(0,0,0,0.3); opacity: 0; transition: opacity 0.2s; }
.task-detail-overlay.open .task-detail-backdrop { opacity: 1; }
.task-detail-panel { position: absolute; top: 0; right: -420px; width: 400px; max-width: 95vw; height: 100%; background: var(--surface); border-left: 1px solid var(--border); box-shadow: -4px 0 20px rgba(0,0,0,0.12); display: flex; flex-direction: column; transition: right 0.25s ease; overflow-y: auto; }
.task-detail-overlay.open .task-detail-panel { right: 0; }
.task-detail-header { padding: 18px 20px; border-bottom: 1px solid var(--border); display: flex; align-items: flex-start; gap: 12px; }
.task-detail-title { font-size: 15px; font-weight: 700; color: var(--text); flex: 1; line-height: 1.35; }
.task-detail-body { padding: 18px 20px; flex: 1; }
.task-detail-field { margin-bottom: 16px; }
.task-detail-label { font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.06em; color: var(--text-light); margin-bottom: 5px; }
.task-detail-value { font-size: 13.5px; color: var(--text); }
.task-notes-section { border-top: 1px solid var(--border); padding-top: 16px; margin-top: 4px; }
.task-notes-title { font-size: 13px; font-weight: 700; color: var(--text); margin-bottom: 12px; }
.task-note-entry { background: var(--surface2); border-radius: var(--radius-sm); padding: 10px 12px; margin-bottom: 8px; }
.task-note-entry-author { font-size: 11px; font-weight: 700; color: var(--green); margin-bottom: 3px; }
.task-note-entry-text { font-size: 13px; color: var(--text); line-height: 1.45; }
.task-note-entry-footer { display: flex; justify-content: space-between; align-items: center; margin-top: 5px; }
.task-note-entry-date { font-size: 11px; color: var(--text-light); }
/* DRIVE LINK */
.drive-link-btn { display: inline-flex; align-items: center; gap: 5px; font-size: 12px; color: #1a73e8; text-decoration: none; padding: 3px 10px; border: 1px solid #c5d8f8; border-radius: 20px; background: #e8f0fe; transition: background 0.15s; }
.drive-link-btn:hover { background: #d2e3fc; }
.area-detail-banner { padding: 18px 22px; border-radius: var(--radius); margin-bottom: 6px; display: flex; align-items: center; gap: 16px; }
.area-detail-banner-name { font-size: 22px; font-weight: 700; color: #fff; }
.area-detail-banner-stats { font-size: 13px; color: rgba(255,255,255,0.8); }
.task-check.inprogress { background: #FFF3CD; border-color: #B8860B; color: #B8860B; }
</style>
</head>
<body>

<!-- LOGIN -->

<!-- Firebase SDK -->
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import { getFirestore, collection, doc, addDoc, setDoc, updateDoc, deleteDoc, onSnapshot, serverTimestamp, query, orderBy } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyB-oAbfjKJcvw5o7ql0t7_xEExsZIPQZh8",
  authDomain: "openfarma-retail.firebaseapp.com",
  projectId: "openfarma-retail",
  storageBucket: "openfarma-retail.firebasestorage.app",
  messagingSenderId: "852234974738",
  appId: "1:852234974738:web:92c81acd576d3f48474acb"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

// ── CONSTANTS ──
const TEAM_PIN = "1234";
const COLORS = [
  "#00C22B","#009E22","#5C7A3E","#2ECC71","#1ABC9C",
  "#2A4A7F","#3498DB","#4A7C8E","#1A6B8A",
  "#8B4E9E","#9B59B6","#E91E8C","#E74C3C","#CC2222",
  "#B8860B","#F39C12","#E67E22","#D35400",
  "#795548","#607D8B","#455A64","#888888"
];

// ── STATE ──
let currentUser = null;
let projects = {};
let activities = [];
let currentProjectId = null;
let currentTab = "tasks";
let editingProjectId = null;
let selectedColor = COLORS[0];
let currentView = "dashboard";
let unsubProjects = null;
let unsubActivities = null;
let areas = {};
let editingAreaId = null;
let selectedAreaColor = COLORS[0];
let unsubAreas = null;
let currentTaskDetail = null;
let currentAreaId = null;

// ── UTILS ──
function uid() { return Math.random().toString(36).substr(2,9); }
function fmtDate(d) { return d.toLocaleDateString("es-AR",{day:"2-digit",month:"2-digit",year:"2-digit"}); }
function isOverdue(ds) { if(!ds) return false; return new Date(ds) < new Date(); }
function getPrioColor(p) { return p==="alta"?"#CC2222":p==="media"?"#B8860B":"#00C22B"; }
function getFileIcon(n) {
  const e=n.split(".").pop().toLowerCase();
  if(["jpg","jpeg","png","gif","webp"].includes(e)) return "&#128444;";
  if(e==="pdf") return "&#128196;";
  if(["xls","xlsx","csv"].includes(e)) return "&#128202;";
  if(["doc","docx"].includes(e)) return "&#128221;";
  if(["ppt","pptx"].includes(e)) return "&#128203;";
  return "&#128206;";
}
function fmtFileSize(b) { if(b<1024)return b+" B"; if(b<1048576)return(b/1024).toFixed(1)+" KB"; return(b/1048576).toFixed(1)+" MB"; }
function showSaving(msg) { const el=document.getElementById("saving-indicator"); el.textContent=msg; setTimeout(()=>el.textContent="",2000); }

// ── AUTH ──
function initAuth() {
  const saved = sessionStorage.getItem("of_user");
  if (saved) { try { currentUser = JSON.parse(saved); showApp(); return; } catch(e){} }
  document.getElementById("login-overlay").classList.remove("hidden");
  setTimeout(()=>document.getElementById("login-name").focus(),100);
}

window.doLogin = function() {
  const name=document.getElementById("login-name").value.trim();
  const pin=document.getElementById("login-pin").value.trim();
  const err=document.getElementById("login-error");
  if(!name){err.textContent="Por favor ingresa tu nombre.";return;}
  if(pin!==TEAM_PIN){err.textContent="PIN incorrecto.";document.getElementById("login-pin").value="";document.getElementById("login-pin").focus();return;}
  err.textContent="";
  currentUser={name,initials:name.split(" ").map(w=>w[0]).join("").toUpperCase().substr(0,2)};
  sessionStorage.setItem("of_user",JSON.stringify(currentUser));
  showApp();
};

window.doLogout = function() {
  sessionStorage.removeItem("of_user");
  currentUser = null;
  if(unsubProjects) unsubProjects();
  if(unsubActivities) unsubActivities();
  projects = {}; activities = [];
  document.getElementById("user-chip").style.display="none";
  document.getElementById("logout-btn").style.display="none";
  document.getElementById("login-overlay").classList.remove("hidden");
  document.getElementById("login-pin").value="";
  document.getElementById("login-name").value="";
  document.getElementById("login-error").textContent="";
  setTimeout(()=>document.getElementById("login-name").focus(),100);
};

function showApp() {
  document.getElementById("login-overlay").classList.add("hidden");
  document.getElementById("user-chip").style.display="flex";
  document.getElementById("logout-btn").style.display="block";
  document.getElementById("user-avatar").textContent=currentUser.initials;
  document.getElementById("user-name-display").textContent=currentUser.name;
  startListeners();
}

// ── FIRESTORE LISTENERS (real-time) ──
function startListeners() {
  // Projects
  unsubProjects = onSnapshot(collection(db,"projects"), snap => {
    projects = {};
    snap.forEach(d => { projects[d.id] = { id: d.id, ...d.data() }; });
    refreshUI();
  });
  // Activity feed
  const actQ = query(collection(db,"activity"), orderBy("ts","desc"));
  unsubActivities = onSnapshot(actQ, snap => {
    activities = [];
    snap.forEach(d => activities.push({ id: d.id, ...d.data() }));
    if(currentView==="dashboard") renderDashboard();
  });
  // Areas
  unsubAreas = onSnapshot(collection(db,"areas"), snap => {
    areas = {};
    snap.forEach(d => { areas[d.id] = { id: d.id, ...d.data() }; });
    refreshUI();
  });
}

function refreshUI() {
  renderSidebar();
  renderSidebarAreas();
  if(currentView==="dashboard") renderDashboard();
  else if(currentView==="allProjects") renderAllProjects();
  else if(currentView==="allTasks") renderAllTasks();
  else if(currentView==="projectDetail" && currentProjectId) renderProjectDetail(currentProjectId);
  else if(currentView==="areaDetail" && currentAreaId) renderAreaDetail(currentAreaId);
  if(currentTaskDetail) {
    const {taskId,projId}=currentTaskDetail;
    const p=projects[projId];
    const t=p&&(p.tasks||[]).find(t=>t.id===taskId);
    if(t) renderTaskDetailNotes(t);
  }
}

// ── ACTIVITY ──
async function addActivity(text, color) {
  try {
    await addDoc(collection(db,"activity"), { text, color, user: currentUser.name, ts: serverTimestamp() });
  } catch(e) { console.error(e); }
}

// ── NAVIGATION ──
window.showView = function(view, projId) {
  currentView = view;
  document.querySelectorAll(".view").forEach(v=>v.classList.remove("active"));
  document.querySelectorAll(".nav-item").forEach(n=>n.classList.remove("active"));
  document.querySelectorAll(".proj-nav-item").forEach(n=>n.classList.remove("active"));
  const el=document.getElementById("view-"+view); if(el) el.classList.add("active");
  const nav=document.getElementById("nav-"+view); if(nav) nav.classList.add("active");
  const btn=document.getElementById("topbar-action-btn");
  if(view==="dashboard") { document.getElementById("topbar-title").textContent="Resumen"; btn.textContent="+ Nuevo proyecto"; btn.style.display="inline-flex"; renderDashboard(); }
  else if(view==="allProjects") { document.getElementById("topbar-title").textContent="Proyectos"; btn.textContent="+ Nuevo proyecto"; btn.style.display="inline-flex"; renderAllProjects(); }
  else if(view==="allTasks") { document.getElementById("topbar-title").textContent="Tareas"; btn.style.display="none"; renderAllTasks(); }
  else if(view==="projectDetail" && projId) {
    currentProjectId=projId;
    const p=projects[projId]; if(!p) return;
    document.getElementById("topbar-title").textContent=p.name;
    btn.textContent="+ Nueva tarea"; btn.style.display="inline-flex";
    const ni=document.getElementById("proj-nav-"+projId); if(ni) ni.classList.add("active");
    renderProjectDetail(projId);
  }
};

window.topbarAction = function() {
  if(currentView==="dashboard"||currentView==="allProjects") openNewProjectModal();
  else if(currentView==="areaDetail") openNewProjectModal();
  else if(currentView==="projectDetail") { switchTab("tasks"); document.getElementById("new-task-input").focus(); }
};

window.showAreaDetail = function(areaId) {
  currentView="areaDetail";
  currentAreaId=areaId;
  document.querySelectorAll(".view").forEach(v=>v.classList.remove("active"));
  document.getElementById("view-areaDetail").classList.add("active");
  const btn=document.getElementById("topbar-action-btn");
  btn.textContent="+ Nuevo proyecto"; btn.style.display="inline-flex";
  renderAreaDetail(areaId);
};

function renderAreaDetail(areaId) {
  const a=areas[areaId]; if(!a) return;
  const proj=Object.values(projects).filter(p=>p.areaId===areaId);
  const allTasks=proj.flatMap(p=>p.tasks||[]);
  const pending=allTasks.filter(t=>!t.done).length;
  document.getElementById("topbar-title").textContent=a.name;
  document.getElementById("area-detail-header").innerHTML=`
    <div class="area-detail-banner" style="background:${a.color};">
      <div>
        <div class="area-detail-banner-name">${a.name}</div>
        <div class="area-detail-banner-stats">${proj.length} proyecto${proj.length===1?"":"s"} &middot; ${pending} tarea${pending===1?"":"s"} pendiente${pending===1?"":"s"}</div>
      </div>
    </div>`;
  const grid=document.getElementById("area-projects-grid");
  if(!proj.length){
    grid.innerHTML="<div class='empty-state' style='grid-column:1/-1;'><p>No hay proyectos en esta área. Creá el primero.</p></div>";
    return;
  }
  grid.innerHTML=proj.map(p=>{
    const tasks=p.tasks||[],donT=tasks.filter(t=>t.done).length,pct=tasks.length>0?Math.round(donT/tasks.length*100):0;
    return`<div class="project-card" onclick="showView('projectDetail','${p.id}')" style="border-left-color:${a.color}">
      <div class="project-card-header"><div class="project-color-dot" style="background:${a.color}"></div>
        <div><div class="project-card-name">${p.name}</div>
          ${p.dueDate?`<div style="font-size:11px;color:var(--text-light);">Vence: ${new Date(p.dueDate).toLocaleDateString("es-AR",{day:"2-digit",month:"2-digit",year:"2-digit"})}</div>`:""}</div></div>
      ${p.desc?`<div class="project-desc">${p.desc}</div>`:""}
      <div class="project-meta"><span class="badge badge-${p.status}">${p.status}</span><span class="badge badge-${p.priority}">${p.priority}</span></div>
      <div class="progress-bar"><div class="progress-fill" style="width:${pct}%;background:${a.color}"></div></div>
      <div class="task-count">${donT}/${tasks.length} tareas completadas</div>
      ${p.driveLink?`<div style="margin-top:8px;"><a href="${p.driveLink}" target="_blank" class="drive-link-btn" onclick="event.stopPropagation()">🔗 Ver en Drive</a></div>`:""}
    </div>`;}).join("");
}

// ── SIDEBAR ──
function renderSidebar() {
  const proj = Object.values(projects);
  document.getElementById("proj-count").textContent = proj.length;
  document.getElementById("task-count-nav").textContent = proj.reduce((a,p)=>a+(p.tasks||[]).filter(t=>!t.done).length,0);
  document.getElementById("sidebar-proj-list").innerHTML = proj.map(p=>`
    <div class="proj-nav-item" id="proj-nav-${p.id}" onclick="showView('projectDetail','${p.id}')">
      <div class="proj-dot" style="background:${p.color}"></div>
      <span class="proj-nav-name">${p.name}</span>
    </div>`).join("");
  if(currentProjectId) { const ni=document.getElementById("proj-nav-"+currentProjectId); if(ni) ni.classList.add("active"); }
}

// ── DASHBOARD ──
function renderDashboard() {
  const proj=Object.values(projects);
  const areaList=Object.values(areas);
  document.getElementById("areas-grid").innerHTML=areaList.length>0
    ?areaList.map(a=>{
      const aProj=proj.filter(p=>p.areaId===a.id);
      const allTasks=aProj.flatMap(p=>p.tasks||[]);
      const pending=allTasks.filter(t=>!t.done).length;
      const done=allTasks.filter(t=>t.done).length;
      const total=allTasks.length;
      const pct=total>0?Math.round(done/total*100):0;
      return`<div class="area-card" style="border-top-color:${a.color};cursor:pointer;" onclick="showAreaDetail('${a.id}')">
        <div class="area-card-name" style="color:${a.color};">${a.name}</div>
        <div class="area-card-stat" style="color:${a.color};">${aProj.length}</div>
        <div class="area-card-sub">${aProj.length===1?"proyecto":"proyectos"}</div>
        <div class="area-card-sub" style="margin-top:4px;">${pending} pendiente${pending===1?"":"s"}</div>
        <div class="progress-bar" style="margin-top:10px;"><div class="progress-fill" style="width:${pct}%;background:${a.color}"></div></div>
        <div style="font-size:11px;color:var(--text-light);margin-top:4px;">${pct}% completado</div>
      </div>`;}).join("")
    :"<div class='empty-state' style='grid-column:1/-1;'><p>Creá tu primera área desde el sidebar.</p></div>";
}

// ── ALL PROJECTS ──
function renderAllProjects() {
  const grid=document.getElementById("all-projects-grid");
  const proj=Object.values(projects);
  if(!proj.length){grid.innerHTML="<div class='empty-state' style='grid-column:1/-1;'><p>Crea tu primer proyecto.</p></div>";return;}
  grid.innerHTML=proj.map(p=>{
    const area=areas[p.areaId],color=area?area.color:"#888";
    const tasks=p.tasks||[],donT=tasks.filter(t=>t.done).length,pct=tasks.length>0?Math.round(donT/tasks.length*100):0;
    return`<div class="project-card" onclick="showView('projectDetail','${p.id}')" style="border-left-color:${color}">
      <div class="project-card-header"><div class="project-color-dot" style="background:${color}"></div>
        <div><div class="project-card-name">${p.name}</div>
          ${area?`<div style="font-size:11px;color:${color};font-weight:700;">${area.name}</div>`:""}
          ${p.dueDate?`<div style="font-size:11px;color:var(--text-light);">Vence: ${new Date(p.dueDate).toLocaleDateString("es-AR",{day:"2-digit",month:"2-digit",year:"2-digit"})}</div>`:""}</div></div>
      ${p.desc?`<div class="project-desc">${p.desc}</div>`:""}
      <div class="project-meta"><span class="badge badge-${p.status}">${p.status}</span><span class="badge badge-${p.priority}">${p.priority}</span></div>
      <div class="progress-bar"><div class="progress-fill" style="width:${pct}%;background:${color}"></div></div>
      <div class="task-count">${donT}/${tasks.length} tareas</div></div>`;}).join("");
}

// ── ALL TASKS ──
function renderAllTasks() {
  const all=Object.values(projects).flatMap(p=>(p.tasks||[]).map(t=>({...t,projName:p.name,projColor:p.color,projId:p.id})));
  const pending=all.filter(t=>!t.done),done=all.filter(t=>t.done);
  let html="";
  if(!all.length) html="<div class='empty-state'><p>No hay tareas.</p></div>";
  else {
    if(pending.length) html+=`<div class="section-title" style="margin-bottom:12px;">Pendientes (${pending.length})</div><div class="task-list">${pending.map(t=>renderTaskItem(t,true)).join("")}</div>`;
    if(done.length) html+=`<div class="section-title" style="margin:18px 0 12px;">Completadas (${done.length})</div><div class="task-list">${done.map(t=>renderTaskItem(t,true)).join("")}</div>`;
  }
  document.getElementById("all-tasks-content").innerHTML=html;
}

// ── PROJECT DETAIL ──
function renderProjectDetail(projId) {
  const p=projects[projId]; if(!p) return;
  const area=areas[p.areaId],color=area?area.color:"#888";
  document.getElementById("detail-title").textContent=p.name;
  document.getElementById("detail-meta").innerHTML=`
    ${area?`<span style="font-size:12px;font-weight:700;color:${color};background:${color}18;padding:3px 10px;border-radius:20px;">${area.name}</span>`:""}
    <span class="badge badge-${p.status}">${p.status}</span>
    <span class="badge badge-${p.priority}">${p.priority} prioridad</span>
    ${p.dueDate?`<span style="font-size:13px;color:var(--text-muted);">Vence: ${new Date(p.dueDate).toLocaleDateString("es-AR",{day:"2-digit",month:"2-digit",year:"2-digit"})}</span>`:""}
    ${p.driveLink?`<a href="${p.driveLink}" target="_blank" class="drive-link-btn">🔗 Ver en Drive</a>`:""}
    ${p.desc?`<span style="font-size:13px;color:var(--text-muted);display:block;width:100%;margin-top:4px;">${p.desc}</span>`:""}`;
  document.getElementById("detail-border").style.borderBottomColor=color;
  switchTab("tasks");
}

window.switchTab = function(tab) {
  currentTab=tab;
  document.getElementById("tab-tasks").style.display="block";
  if(tab==="tasks") renderProjectTasks();
  if(tab==="tasks"&&currentUser){ const f=document.getElementById("new-task-person"); if(f&&!f.value) f.value=currentUser.name; }
};

function renderTaskItem(t, showProj) {
  const projId=t.projId||currentProjectId;
  const taskNotes=t.notes||[];
  const statusIcon = t.done ? "&#10003;" : t.inProgress ? "&#9654;" : "";
  const statusClass = t.done ? " done" : t.inProgress ? " inprogress" : "";
  const today=new Date(); today.setHours(0,0,0,0);
  const tomorrow=new Date(today); tomorrow.setDate(tomorrow.getDate()+1);
  const taskDate=t.date?new Date(t.date):null;
  let dateClass="", dateBadge="";
  if(taskDate){
    taskDate.setHours(0,0,0,0);
    if(!t.done){
      if(taskDate<today){dateClass=" overdue";dateBadge=`<span style="font-size:10px;background:#FFE8E8;color:#CC2222;padding:1px 6px;border-radius:10px;font-weight:700;">Vencida</span>`;}
      else if(taskDate.getTime()===today.getTime()){dateClass=" overdue";dateBadge=`<span style="font-size:10px;background:#FFF3CD;color:#856404;padding:1px 6px;border-radius:10px;font-weight:700;">Hoy</span>`;}
      else if(taskDate.getTime()===tomorrow.getTime()){dateBadge=`<span style="font-size:10px;background:#E3EAF6;color:#1A3460;padding:1px 6px;border-radius:10px;font-weight:700;">Mañana</span>`;}
    }
  }
  return`<div class="task-item${t.done?" completed":""}" id="taskitem-${t.id}">
    <div class="task-item-row">
      <div class="task-check${statusClass}" onclick="cycleTaskStatus('${t.id}','${projId}')" title="${t.done?'Completada':t.inProgress?'En progreso':'Pendiente'}">${statusIcon}</div>
      <div class="task-prio" style="background:${getPrioColor(t.priority)}"></div>
      <div style="flex:1;cursor:pointer;" onclick="openTaskDetail('${t.id}','${projId}')"><div class="task-title">${t.title}</div>${showProj?`<div style="font-size:11px;color:var(--text-light);">Proyecto: ${t.projName}</div>`:""}</div>
      <div class="task-meta-row">
        ${t.person?`<span class="task-person">${t.person}</span>`:""}
        ${dateBadge}
        <input type="date" class="task-date-input${dateClass}${!t.date?" empty":""}" value="${t.date||''}" onchange="updateTaskDate('${t.id}','${projId}',this.value)" title="${t.date?'Cambiar fecha':'Agregar fecha'}">
        <button class="task-notes-btn${taskNotes.length?" has-notes":""}" onclick="openTaskDetail('${t.id}','${projId}')" title="Ver detalles y notas">&#128203;${taskNotes.length?` ${taskNotes.length}`:""}</button>
        <button onclick="deleteTask('${t.id}','${projId}')" style="background:none;border:none;cursor:pointer;color:var(--text-light);font-size:13px;padding:2px 6px;" title="Eliminar">&#10005;</button>
      </div>
    </div>
  </div>`;
}

function renderProjectTasks() {
  const p=projects[currentProjectId]; if(!p) return;
  const tasks=p.tasks||[];
  if(!tasks.length){document.getElementById("project-tasks-list").innerHTML="<div class='empty-state'><p>Sin tareas. Agrega la primera.</p></div>";}
  else {
    const pending=tasks.filter(t=>!t.done), done=tasks.filter(t=>t.done);
    document.getElementById("project-tasks-list").innerHTML=[...pending,...done].map(t=>renderTaskItem(t,false)).join("");
  }
  // Render project activity
  const projActivities = activities.filter(a => a.text && a.text.includes(p.name));
  const actEl=document.getElementById("project-activity-list");
  if(actEl) actEl.innerHTML = projActivities.length>0
    ? projActivities.slice(0,8).map(a=>`<div class="activity-item"><div class="activity-dot" style="background:${a.color}"></div><span class="activity-text"><strong>${a.user||""}</strong> ${a.text}</span><span class="activity-time">${a.ts?.toDate?fmtDate(a.ts.toDate()):""}</span></div>`).join("")
    : "<div class='empty-state'><p>Sin actividad registrada.</p></div>";
}

function renderProjectNotes() {
  const p=projects[currentProjectId]; if(!p) return;
  const notes=p.notes||[];
  if(!notes.length){document.getElementById("project-notes-list").innerHTML="<div class='empty-state' style='grid-column:1/-1;'><p>Sin notas.</p></div>";return;}
  document.getElementById("project-notes-list").innerHTML=notes.slice().reverse().map(n=>`
    <div class="note-card">
      <div class="note-card-header"><span class="note-date">${n.date}</span><button onclick="deleteNote('${n.id}')" style="background:none;border:none;cursor:pointer;color:var(--text-light);font-size:13px;">&#10005;</button></div>
      <div class="note-author">${n.author}</div>
      <div class="note-text">${n.text}</div>
    </div>`).join("");
}

function renderProjectFiles() {
  const p=projects[currentProjectId]; if(!p) return;
  const files=p.files||[];
  if(!files.length){document.getElementById("project-files-list").innerHTML="<div class='empty-state'><p>Sin archivos.</p></div>";return;}
  document.getElementById("project-files-list").innerHTML=files.slice().reverse().map(f=>`
    <div class="file-item">
      <div class="file-icon">${getFileIcon(f.name)}</div>
      <div class="file-info"><div class="file-name">${f.name}</div><div class="file-meta">${fmtFileSize(f.size)} &middot; ${f.date} &middot; ${f.uploadedBy||""}</div></div>
      <button onclick="deleteFile('${f.id}')" style="background:none;border:none;cursor:pointer;color:var(--text-light);font-size:14px;padding:4px 8px;">&#10005;</button>
    </div>`).join("");
}

// ── FILTER & SORT TASKS ──
window.filterTasks = function() {
  const p=projects[currentProjectId]; if(!p) return;
  const query=(document.getElementById("task-filter-input")?.value||"").toLowerCase();
  const sort=document.getElementById("task-sort-select")?.value||"default";
  let tasks=[...(p.tasks||[])];
  if(query) tasks=tasks.filter(t=>t.title.toLowerCase().includes(query)||(t.person||"").toLowerCase().includes(query));
  const prioOrder={alta:0,media:1,baja:2};
  if(sort==="date") tasks.sort((a,b)=>(a.date||"9")>(b.date||"9")?1:-1);
  else if(sort==="priority") tasks.sort((a,b)=>(prioOrder[a.priority]||1)-(prioOrder[b.priority]||1));
  else if(sort==="person") tasks.sort((a,b)=>(a.person||"").localeCompare(b.person||""));
  else if(sort==="status") tasks.sort((a,b)=>Number(b.done)-Number(a.done)||Number(b.inProgress)-Number(a.inProgress));
  const pending=tasks.filter(t=>!t.done),done=tasks.filter(t=>t.done);
  document.getElementById("project-tasks-list").innerHTML=[...pending,...done].map(t=>renderTaskItem(t,false)).join("") || "<div class='empty-state'><p>No se encontraron tareas.</p></div>";
};

// ── TASKS CRUD ──
window.addTask = async function() {
  const title=document.getElementById("new-task-input").value.trim(); if(!title) return;
  const p=projects[currentProjectId]; if(!p) return;
  const task={id:uid(),title,done:false,person:document.getElementById("new-task-person").value.trim()||currentUser.name,date:document.getElementById("new-task-date").value,priority:document.getElementById("new-task-prio").value,createdBy:currentUser.name};
  const tasks=[...(p.tasks||[]),task];
  await updateDoc(doc(db,"projects",currentProjectId),{tasks});
  addActivity(`agrego tarea "${title}" en ${p.name}`,p.color);
  showSaving("Guardado");
  document.getElementById("new-task-input").value="";
  document.getElementById("new-task-date").value="";
};

window.cycleTaskStatus = async function(taskId, projId) {
  const p=projects[projId]; if(!p) return;
  const tasks=(p.tasks||[]).map(t=>{
    if(t.id!==taskId) return t;
    if(!t.inProgress&&!t.done) return {...t,inProgress:true,done:false};
    if(t.inProgress&&!t.done) return {...t,inProgress:false,done:true};
    return {...t,inProgress:false,done:false};
  });
  await updateDoc(doc(db,"projects",projId),{tasks});
  const t=tasks.find(t=>t.id===taskId);
  if(t?.done) addActivity(`completo tarea "${t.title}"`,p.color);
  showSaving("Guardado");
};

window.toggleTask = async function(taskId, projId) {
  await cycleTaskStatus(taskId, projId);
};

window.deleteTask = async function(taskId, projId) {
  const p=projects[projId]; if(!p) return;
  const tasks=(p.tasks||[]).filter(t=>t.id!==taskId);
  await updateDoc(doc(db,"projects",projId),{tasks});
  showSaving("Eliminado");
};

// ── TASK DATE & TASK NOTES ──
window.updateTaskDate = async function(taskId, projId, newDate) {
  const p=projects[projId]; if(!p) return;
  const tasks=(p.tasks||[]).map(t=>{
    if(t.id!==taskId) return t;
    const hist=[...(t.dateHistory||[]),{date:t.date||null,changedAt:fmtDate(new Date()),changedBy:currentUser.name}].slice(-3);
    return {...t,date:newDate,dateHistory:hist};
  });
  await updateDoc(doc(db,"projects",projId),{tasks});
  showSaving("Guardado");
};

window.toggleTaskNotes = function(taskId) {
  const panel=document.getElementById("notes-panel-"+taskId);
  if(panel) panel.style.display=panel.style.display==="block"?"none":"block";
};

window.addTaskNote = async function(taskId, projId) {
  const input=document.getElementById("note-input-"+taskId);
  const text=input?.value.trim(); if(!text) return;
  const p=projects[projId]; if(!p) return;
  const note={id:uid(),author:currentUser.name,text,date:fmtDate(new Date())};
  const taskTitle=(p.tasks||[]).find(t=>t.id===taskId)?.title||"tarea";
  const tasks=(p.tasks||[]).map(t=>t.id===taskId?{...t,notes:[...(t.notes||[]),note]}:t);
  await updateDoc(doc(db,"projects",projId),{tasks});
  addActivity(`agrego nota en "${taskTitle}"`,p.color);
  showSaving("Guardado");
};

window.deleteTaskNote = async function(taskId, projId, noteId) {
  const p=projects[projId]; if(!p) return;
  const tasks=(p.tasks||[]).map(t=>t.id===taskId?{...t,notes:(t.notes||[]).filter(n=>n.id!==noteId)}:t);
  await updateDoc(doc(db,"projects",projId),{tasks});
  showSaving("Eliminado");
};

// ── TASK DETAIL PANEL ──
window.openTaskDetail = function(taskId, projId) {
  const p=projects[projId]; if(!p) return;
  const t=(p.tasks||[]).find(t=>t.id===taskId); if(!t) return;
  currentTaskDetail={taskId,projId};
  document.getElementById("td-title").textContent=t.title;
  document.getElementById("td-person").textContent=t.person||"—";
  document.getElementById("td-date").value=t.date||"";
  document.getElementById("td-prio").innerHTML=`<span style="background:${getPrioColor(t.priority)}18;color:${getPrioColor(t.priority)};padding:2px 10px;border-radius:20px;font-weight:700;">${t.priority}</span>`;
  document.getElementById("td-status").textContent=t.done?"✓ Completada":"Pendiente";
  renderTaskDetailNotes(t);
  renderDateHistory(t);
  document.getElementById("task-detail-overlay").classList.add("open");
};

window.closeTaskDetail = function() {
  document.getElementById("task-detail-overlay").classList.remove("open");
  currentTaskDetail=null;
};

function renderDateHistory(t) {
  const hist=t.dateHistory||[];
  const el=document.getElementById("td-date-history");
  if(!el) return;
  el.innerHTML=hist.length>0
    ?hist.slice().reverse().map(h=>`<span style="font-size:11px;background:var(--surface2);border:1px solid var(--border);padding:2px 8px;border-radius:10px;color:var(--text-muted);">${h.date?new Date(h.date).toLocaleDateString("es-AR",{day:"2-digit",month:"2-digit",year:"2-digit"}):"Sin fecha"} → ${h.changedAt} por ${h.changedBy}</span>`).join("<br style='margin:2px 0;display:block;'>")
    :"<span style='font-size:12px;color:var(--text-light);'>Sin cambios previos</span>";
}

function renderTaskDetailNotes(t) {
  const notes=t.notes||[];
  document.getElementById("td-notes-list").innerHTML=notes.length
    ?notes.map(n=>{
      const isMe=n.author===currentUser?.name;
      return`<div class="task-note-entry" style="${isMe?'border-left:3px solid var(--green);':'border-left:3px solid var(--border);'}">
        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:4px;">
          <div class="task-note-entry-author" style="display:flex;align-items:center;gap:6px;">
            <div style="width:22px;height:22px;border-radius:50%;background:${isMe?'var(--green)':'#888'};color:#fff;display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:700;">${n.author.split(" ").map(w=>w[0]).join("").substr(0,2).toUpperCase()}</div>
            ${n.author}
          </div>
          <button onclick="deleteTaskNote('${t.id}','${currentTaskDetail?.projId||currentProjectId}','${n.id}')" style="background:none;border:none;cursor:pointer;color:var(--text-light);font-size:11px;">&#10005;</button>
        </div>
        <div class="task-note-entry-text">${n.text}</div>
        <div class="task-note-entry-date" style="margin-top:4px;">${n.date}</div>
      </div>`;}).join("")
    :"<p style='font-size:13px;color:var(--text-light);padding:4px 0;'>Sin comentarios aún.</p>";
}

window.updateTaskDateFromPanel = async function(newDate) {
  if(!currentTaskDetail) return;
  await updateTaskDate(currentTaskDetail.taskId,currentTaskDetail.projId,newDate);
};

window.addTaskNoteFromPanel = async function() {
  if(!currentTaskDetail) return;

  const taskTitle=(p.tasks||[]).find(t=>t.id===taskId)?.title||"tarea";
  const tasks=(p.tasks||[]).map(t=>t.id===taskId?{...t,notes:[...(t.notes||[]),note]}:t);

  document.getElementById("area-modal-title").textContent="Editar área";

window.saveProject = async function() {

  const area=areaId?areas[areaId]:null;

    await setDoc(ref,{...data,tasks:[],notes:[],createdBy:currentUser.name,createdAt:new Date().toISOString()});
    addActivity(`creo el proyecto "${name}"`,data.color);
    showSaving("Guardado"); closeModal("proj-modal"); showView("allProjects");

};

window.deleteCurrentProject = async function() {
  const p=projects[currentProjectId]; if(!p) return;
  if(!confirm(`Eliminar el proyecto "${p.name}"?`)) return;
  await deleteDoc(doc(db,"projects",currentProjectId));
  addActivity(`elimino el proyecto "${p.name}"`,"#888");
  currentProjectId=null;
  showView("allProjects");
};
